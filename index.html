<style>
/* =========================================================
   WR da Prata — design tokens
   Paper (client catalog): warm stone white, ink text, silver line accents
   Atelier (vendor panel): near-black admin surface, same silver accent
   Display type: elegant serif (system) — Body: system sans — Data: system mono
   Signature element: hand-drawn monoline jewelry sketches as product art,
   with a slow "shimmer sweep" on hover (light catching metal).
   ========================================================= */
:root{
  --paper:#F6F5F2;
  --paper-2:#EFEDE8;
  --ink:#171614;
  --ink-soft:#4A4844;
  --line:#DEDAD2;
  --silver:#B8BCC0;
  --silver-deep:#8A8F94;
  --accent:#A69B85;      /* champagne-silver, not gold, not terracotta */
  --accent-deep:#8C8067;
  --white:#FFFFFF;
  --content-w:520px;

  --atelier-bg:#111113;
  --atelier-panel:#18181B;
  --atelier-panel-2:#1F1F23;
  --atelier-line:#2B2B30;
  --atelier-text:#EDEDEC;
  --atelier-muted:#98979C;

  --ok:#5C8A6E;
  --warn:#B08A4E;
  --danger:#B15A4A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  line-height:1.5;
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1, "cv11" 1;
}
h1,h2,h3,.display{
  font-family:Georgia, 'Times New Roman', serif;
  font-weight:600;
  letter-spacing:-.01em;
  line-height:1.15;
  margin:0;
}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric:tabular-nums;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--accent);color:var(--white);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

.app-shell{max-width:1180px;margin:0 auto;min-height:100vh;position:relative;}

/* ---------- CLIENT: header ---------- */

.subnav{display:flex;gap:4px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none;}
.subnav::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;padding:7px 15px;border-radius:30px;font-size:15.5px;font-weight:600;
  border:1px solid var(--line);background:var(--white);color:var(--ink-soft);white-space:nowrap;transition:all .2s;
}
.chip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

/* ---------- CLIENT: home ---------- */

.btn{
  display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:1px;font-size:16px;font-weight:700;
  letter-spacing:.04em;border:1px solid transparent;transition:all .2s;
}
.btn-primary{background:var(--ink);color:var(--white);}
.btn-primary:hover{background:#000;}
.btn-light{background:var(--white);color:var(--ink);}
.btn-outline{background:transparent;border-color:var(--white);color:var(--white);}
.btn-outline-dark{background:transparent;border-color:var(--ink);color:var(--ink);}

.product-card:hover 

.stock-dot{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;color:var(--ink-soft);margin-top:2px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}
.dot.out{background:var(--danger);}

.info-strip{margin:34px 14px 30px;border:1px solid var(--line);border-radius:2px;background:var(--white);
  padding:22px;display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:640px){.info-strip{grid-template-columns:repeat(3,1fr);}}

.info-strip svg{width:20px;height:20px;flex:0 0 auto;margin-top:2px;}
.info-strip h4{font-size:16px;font-weight:700;margin-bottom:3px;}
.info-strip p{font-size:15px;color:var(--ink-soft);margin:0;line-height:1.5;}

.wa-fab{
  position:fixed;bottom:84px;right:18px;z-index:50;background:var(--ink);color:var(--white);width:48px;height:48px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);border:none;
}
@media(min-width:760px){.wa-fab{bottom:24px;}}

.content-pad-bottom{padding-bottom:104px;}
@media(min-width:760px){.content-pad-bottom{padding-bottom:40px;}}

/* breadcrumb / page header */

/* filters bar */

.filters-bar::-webkit-scrollbar{display:none;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:30px;
  padding:9px 14px;flex:1;min-width:150px;}
.search-box input{border:none;background:none;outline:none;font-size:16px;width:100%;font-family:inherit;}
.search-box svg{width:16px;height:16px;color:var(--ink-soft);flex:0 0 auto;}
.select-pill{border:1px solid var(--line);background:var(--white);border-radius:30px;padding:9px 14px;font-size:15.5px;font-weight:600;color:var(--ink-soft);}

/* product detail */

.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;border-top:1px solid var(--line);padding-top:18px;}
.spec-item{}
.spec-item .k{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);}
.spec-item .v{font-size:17px;font-weight:600;margin-top:3px;}

/* interesses / carrinho */

/* ================= ATELIER (vendor panel) ================= */
.atelier{background:var(--atelier-bg);color:var(--atelier-text);min-height:100vh;}
.atelier .mono{color:var(--atelier-muted);}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px;
  background:radial-gradient(circle at 30% 20%, #201f22, #0d0d0e 70%);}
.back-to-catalog{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--atelier-muted);width:100%;max-width:380px;}
.back-to-catalog:hover{color:var(--white);}
.login-card{width:100%;max-width:380px;background:var(--atelier-panel);border:1px solid var(--atelier-line);border-radius:3px;padding:36px 30px;}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:26px;}
.login-logo svg{width:34px;height:34px;color:var(--silver);}
.login-logo-full{width:190px;height:auto;display:block;margin:0 auto;}
.login-logo .ls{font-size:12px;letter-spacing:.3em;color:var(--atelier-muted);text-transform:uppercase;margin-top:2px;display:block;text-align:center;}
.field{margin-bottom:16px;}
.field label{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--atelier-muted);font-weight:700;display:block;margin-bottom:7px;}
.field input,.field select,.field textarea{
  width:100%;background:var(--atelier-panel-2);border:1px solid var(--atelier-line);border-radius:7px;color:var(--atelier-text);
  padding:12px 14px;font-size:16.5px;font-family:inherit;outline:none;transition:border .2s;
}

.pcard-arrow{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;border:none;}

/* product detail v2 */
.pd2-title{padding:16px 18px 0;font-size:23px;max-width:var(--content-w);margin:0 auto;}
.pd2-stage{position:relative;margin:16px auto 0;max-width:var(--content-w);min-height:280px;display:flex;align-items:center;justify-content:center;padding:0 60px;}
.pd2-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.05;pointer-events:none;}
.pd2-watermark svg,.pd2-watermark img{width:76%;height:76%;object-fit:contain;}
.pd2-art{width:64%;height:64%;color:var(--ink-soft);position:relative;z-index:1;margin:0 auto;}
.pd2-side{position:absolute;top:6px;display:flex;flex-direction:column;gap:8px;align-items:center;}
.pd2-side.left{left:8px;}
.pd2-side.right{right:8px;}
.pd2-side-label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px;}
.size-pill2{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--white);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink);}
.size-pill2.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.swatch2{width:20px;height:20px;border-radius:50%;border:2px solid var(--white);box-shadow:0 0 0 1px var(--line);}
.swatch2.active{box-shadow:0 0 0 2px var(--ink);}
.fav-circle{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;}

.pd2-meta{max-width:var(--content-w);margin:14px auto 0;padding:0 18px;}
.pd2-cat{font-size:13.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-deep);font-weight:700;}
.pd2-desc{margin-top:10px;font-size:16px;line-height:1.65;color:var(--ink-soft);}

.pd2-bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 18px 6px;max-width:var(--content-w);margin:0 auto;}
.pd2-buy-btn{flex:1;max-width:220px;justify-content:center;border-radius:30px;padding:15px 22px;}
.pd2-price-block .lbl{font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;}
.pd2-price-block .val{font-size:27px;font-weight:800;letter-spacing:-.01em;}
.pd2-price-block .old{font-size:15.5px;color:var(--ink-soft);text-decoration:line-through;margin-left:7px;}
.swipe-track{flex:1;max-width:220px;height:50px;background:var(--ink);border-radius:30px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 6px;user-select:none;}
.swipe-knob{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;position:absolute;left:6px;touch-action:none;color:var(--ink);}
.swipe-label{margin-left:52px;color:#fff;font-size:14.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;}

.homebar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:45;
  display:flex;align-items:center;gap:6px;background:var(--ink);border-radius:999px;padding:8px;
  box-shadow:0 16px 34px -14px rgba(0,0,0,.5);}
.homebar-item{display:flex;align-items:center;justify-content:center;padding:2px;}
.homebar-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s,color .2s;}
.homebar-item.active .homebar-dot{background:#fff;color:var(--ink);}

/* catalog / interests / order — v2 continuation */
.pagehead2{max-width:var(--content-w);margin:0 auto;padding:14px 18px 4px;}
.pagehead2 h1{font-size:25px;}
.pagehead2 .sub{font-size:14.5px;color:var(--ink-soft);letter-spacing:.02em;margin-top:4px;display:block;}

.filters2{max-width:var(--content-w);margin:0 auto;padding:8px 18px 2px;display:flex;gap:10px;}
.filters2 .search-box{flex:1;}

.irow2{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);max-width:var(--content-w);margin:0 auto;}
.irow2-thumb{width:58px;height:58px;border-radius:14px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.irow2-thumb svg{width:58%;height:58%;color:var(--ink-soft);}
.irow2-info{flex:1;min-width:0;}
.irow2-info h4{font-family:Georgia, 'Times New Roman', serif;font-size:17.5px;font-weight:700;}
.qty2{display:flex;align-items:center;gap:9px;margin-top:7px;}
.qty2 button{width:23px;height:23px;border-radius:50%;border:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--ink);}
.qty2 span{font-size:15.5px;font-weight:700;min-width:14px;text-align:center;}
.irow2-price{font-size:16px;font-weight:800;white-space:nowrap;}
.irow2-remove{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;color:var(--danger);flex:0 0 auto;}

.summary2{max-width:var(--content-w);margin:16px auto;padding:0 18px;}
.summary2-card{background:var(--paper-2);border-radius:20px;padding:18px 20px;}
.summary2-row{display:flex;justify-content:space-between;font-size:16px;color:var(--ink-soft);margin-bottom:8px;}
.summary2-row.total{font-size:17px;font-weight:800;color:var(--ink);border-top:1px solid var(--line);padding-top:10px;margin-top:6px;}

.cta-bar{max-width:var(--content-w);margin:16px auto 0;padding:0 18px 6px;}
.cta-bar .btn{width:100%;justify-content:center;border-radius:30px;}
.cta-bar-center{display:flex;justify-content:center;margin-top:6px;}

/* client profile (v2) */
.avatar-circle{width:64px;height:64px;border-radius:50%;background:var(--paper-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:Georgia, 'Times New Roman', serif;font-size:26px;font-weight:700;color:var(--ink-soft);margin:4px auto 16px;}
.field2{margin-bottom:14px;max-width:var(--content-w);}
.field2 label{font-size:13.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:6px;}
.field2 input{width:100%;background:var(--white);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:11px 14px;font-size:17px;font-family:inherit;outline:none;}
.field2 input:focus{border-color:var(--ink);}
.profile-card{max-width:var(--content-w);margin:8px auto 0;padding:0 18px;}
.profile-orders{max-width:var(--content-w);margin:22px auto 0;padding:0 18px;}
.profile-orders h3{font-family:Georgia, 'Times New Roman', serif;font-size:18px;margin-bottom:4px;}
.porow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15.5px;}
.porow:last-child{border-bottom:none;}
</style>
</head>

  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6F5F2;font-family:Georgia,serif;color:#8A8F94;letter-spacing:.2em;font-size:13px;text-transform:uppercase;">
    Carregando WR da Prata…
  </div>
</div>
